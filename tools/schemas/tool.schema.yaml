{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "Scientific Health Platform Tool Definition",
  "type": "object",
  "additionalProperties": true,
  "required": [
    "id", "name", "version", "description", "domain", "category", "inputs",
    "outputs", "parameters", "resources", "execution", "container",
    "documentation", "limitations"
  ],
  "properties": {
    "id": {"type": "string", "pattern": "^[a-z0-9][a-z0-9_-]*$"},
    "name": {"type": "string", "minLength": 1},
    "version": {"type": "string", "minLength": 1},
    "description": {"type": "string", "minLength": 1},
    "domain": {"type": "string", "minLength": 1},
    "category": {"type": "string", "minLength": 1},
    "inputs": {"$ref": "#/$defs/dataItems"},
    "outputs": {"$ref": "#/$defs/dataItems"},
    "parameters": {"type": "array", "items": {"$ref": "#/$defs/parameter"}},
    "resources": {"$ref": "#/$defs/resources"},
    "execution": {"$ref": "#/$defs/execution"},
    "container": {"$ref": "#/$defs/container"},
    "documentation": {"$ref": "#/$defs/documentation"},
    "limitations": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}}
  },
  "$defs": {
    "dataItems": {
      "type": "array", "minItems": 1,
      "items": {
        "type": "object", "required": ["id", "required", "type", "format", "biological_meaning", "description"],
        "properties": {
          "id": {"type": "string", "minLength": 1}, "required": {"type": "boolean"},
          "type": {"type": "string", "minLength": 1}, "format": {"type": "array", "minItems": 1, "items": {"type": "string"}},
          "biological_meaning": {"type": "string", "minLength": 1}, "description": {"type": "string", "minLength": 1}
        }
      }
    },
    "parameter": {
      "type": "object", "required": ["id", "type", "description", "required"],
      "properties": {"id": {"type": "string"}, "type": {"type": "string"}, "description": {"type": "string"}, "required": {"type": "boolean"}, "default": {}}
    },
    "resources": {
      "type": "object", "required": ["cpu", "memory", "disk", "gpu_required"],
      "properties": {"cpu": {"type": "string"}, "memory": {"type": "string"}, "disk": {"type": "string"}, "gpu_required": {"type": "boolean"}}
    },
    "environment": {
      "type": "object", "required": ["compatible", "status"],
      "properties": {"compatible": {"type": "boolean"}, "status": {"enum": ["supported", "planned", "unvalidated"]}}
    },
    "execution": {
      "type": "object", "required": ["local", "container", "colab", "cloud"],
      "properties": {"local": {"$ref": "#/$defs/environment"}, "container": {"$ref": "#/$defs/environment"}, "colab": {"$ref": "#/$defs/environment"}, "cloud": {"$ref": "#/$defs/environment"}}
    },
    "container": {
      "type": "object", "required": ["supported", "image", "registry"],
      "properties": {"supported": {"type": "boolean"}, "image": {"type": ["string", "null"]}, "registry": {"type": ["string", "null"]}}
    },
    "documentation": {
      "type": "object", "required": ["official", "url"],
      "properties": {"official": {"type": "boolean"}, "url": {"type": "string", "format": "uri"}}
    }
  }
}
